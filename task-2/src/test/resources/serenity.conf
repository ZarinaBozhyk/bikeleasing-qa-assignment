# Serenity BDD configuration for the Bikeleasing QA assignment.
# Every value can be overridden on the command line, for example:
#   ./gradlew test -Dheadless.mode=false

serenity {
  # Name shown at the top of the Serenity report
  project.name = "Bikeleasing QA Assignment"

  # Screenshots only for failed steps keep the report small and readable
  take.screenshots = FOR_FAILURES
}

# Run Chrome without a visible window (needed for CI).
# Set to false locally to watch the browser.
headless.mode = true

webdriver {
  # Browser used by @Managed fields that do not name a driver
  driver = chrome

  # Base URL of the website under test.
  # Page objects without @DefaultUrl open this address.
  base.url = "https://www.bikeleasing.de"

  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      # A fixed desktop size makes the desktop navigation visible in headless mode
      args = ["--window-size=1920,1080", "--no-sandbox", "--disable-gpu", "--remote-allow-origins=*"]
    }
  }
}

# Base URL of the Cat Facts API used by the API tests
api.base.url = "https://catfact.ninja"