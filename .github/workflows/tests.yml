name: Tests

on:
  workflow_dispatch:   # manual start only

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task-2

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests
        run: ./gradlew clean test "-Dserenity.outputDirectory=$PWD/target/site/serenity"

      # TEMPORARY: find out where Serenity wrote its result files
      - name: Debug - locate Serenity results
        if: always()
        run: |
          echo "=== JSON files in task-2/target/site/serenity ==="
          ls target/site/serenity/*.json 2>/dev/null || echo "none"

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serenity-report
          path: task-2/target/site/serenity

      - name: Upload report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: task-2/target/site/serenity

  publish:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4