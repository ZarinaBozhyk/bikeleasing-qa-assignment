# Runs the Task 2 tests on demand ("Run workflow" button in the Actions tab)
name: Tests

on:
  workflow_dispatch:   # manual start only, no automatic runs on push

jobs:
  test:
    runs-on: ubuntu-latest

    # All commands run inside the Gradle project folder
    defaults:
      run:
        working-directory: task-2

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Chrome is preinstalled on GitHub's Ubuntu runners;
      # headless mode comes from serenity.conf
      - name: Run tests
        run: ./gradlew clean test

      # Upload the report even when tests fail
      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serenity-report
          path: task-2/target/site/serenity